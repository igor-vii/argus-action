name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npx vitest run tests/unit.spec.ts

      - name: Language gate
        run: npm run check:language

      - name: Typecheck (src; tests typecheck with the closed repo locally)
        run: npm run typecheck

      - name: Guard — dist is fresh (forgotten rebuild = red commit)
        run: node build.mjs && git diff --exit-code -- dist/
